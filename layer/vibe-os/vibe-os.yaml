# METABEGIN
# X-Env-Layer-Name: vibe-os
# X-Env-Layer-Category: suite
# X-Env-Layer-Desc: Vibe-coder's OS Raspberry Edition desktop, core service, apps and Pi 3 tuning
# X-Env-Layer-Version: 1.3.0
# X-Env-Layer-Requires: trixie-minbase
# METAEND
---
mmdebstrap:
  packages:
    - rpd-wayland-core
    - rpd-theme
    - rpd-preferences
    - rpd-utilities
    - rpd-wayland-extras
    - rpd-applications
    - rpd-developer
    - rpd-graphics
    - labwc
    - chromium
    - chromium-sandbox
    - xdg-utils
    - dbus-user-session
    - curl
    - python3
    - python3-venv
    - python3-pip
    - python3-gpiozero
    - python3-libcamera
    - libcamera-tools
    - gstreamer1.0-libcamera
    - git
    - build-essential
    - vim
    - nano
    - htop
    - procps
    - psmisc
    - file
    - unzip
    - zip
    - p7zip-full
    - network-manager
    - bluez
    - pipewire
    - pipewire-pulse
    - wireplumber
    - alsa-utils
    - udisks2
    - gvfs
    - gvfs-backends
    - policykit-1
    - sudo
    - openssh-client
    - fonts-noto-core
    - fonts-noto-color-emoji
    # Office & productivity
    - libreoffice
    - libreoffice-gtk3
    - libreoffice-help-common
    - evince
    - cups
    - cups-client
    - system-config-printer
    # Graphics / Paint / creative tools
    - kolourpaint
    - gimp
    - inkscape
    # Mail & calendar
    - thunderbird
  customize-hooks:
    - |
      set -eu
      install -d -m 0755 /opt/vibe-os/backend /opt/vibe-os/frontend /opt/vibe-os/config
      install -d -m 0755 /etc/vibe-os /etc/xdg/labwc /usr/local/bin /usr/share/applications
      install -d -m 0755 /home/vibe/Workspace

      cp -a ${DIRECTORY}/opt/vibe-os/frontend/. /opt/vibe-os/frontend/
      cp -a ${DIRECTORY}/opt/vibe-os/backend/. /opt/vibe-os/backend/
      install -m 0644 ${DIRECTORY}/opt/vibe-os/config.json /opt/vibe-os/config.json
      install -m 0644 ${DIRECTORY}/etc/vibe-os/os-release /etc/vibe-os/os-release
      install -m 0755 ${DIRECTORY}/usr/local/bin/vibe-shell /usr/local/bin/vibe-shell
      install -m 0755 ${DIRECTORY}/etc/xdg/labwc/autostart /etc/xdg/labwc/autostart
      install -m 0644 ${DIRECTORY}/systemd/vibe-os-backend.service /etc/systemd/system/vibe-os-backend.service
      install -m 0644 ${DIRECTORY}/usr/share/applications/vibe-os.desktop /usr/share/applications/vibe-os.desktop

      # device-user-admin from the Raspberry Pi device stack creates the configured user.
      # Keep the workspace owned by that account without inventing a password in the image.
      if id -u vibe >/dev/null 2>&1; then
        chown -R vibe:vibe /home/vibe/Workspace
      fi

      ln -sf /etc/systemd/system/vibe-os-backend.service /etc/systemd/system/multi-user.target.wants/vibe-os-backend.service
      printf '%s\n' 'Vibe-coder''s OS Raspberry Edition customization complete.'
